name: Website
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check-website.py'
      - 'scripts/tests/test_website_theme.js'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/check-website.py'
      - 'scripts/tests/test_website_theme.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-website.py
      - run: node --check website/app.js
      - run: node --check website/appearance.js
      - run: node --test scripts/tests/test_website_theme.js
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
